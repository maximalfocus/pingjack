name: pingjack

services:
  # The secure application is the default service: `docker compose up` starts this and nothing
  # else. Its port is published on the loopback interface only.
  secure:
    build: .
    image: pingjack:dev
    ports:
      - "127.0.0.1:8000:8000"
    # Binding 0.0.0.0 inside the container is what makes the loopback-only published port above
    # reachable; the container's own network is not exposed anywhere else.
    command: ["uvicorn", "pingjack.apps.secure:app", "--host", "0.0.0.0", "--port", "8000"]

  # Intentionally vulnerable. Starting it takes two deliberate actions: this profile, and the
  # acknowledgement variable. Without the acknowledgement the application refuses to start and says
  # so, even when the profile is enabled.
  #
  #   ALLOW_VULNERABLE_DEMO=true docker compose --profile vulnerable up
  vulnerable:
    build: .
    image: pingjack:dev
    profiles: ["vulnerable"]
    environment:
      ALLOW_VULNERABLE_DEMO: ${ALLOW_VULNERABLE_DEMO:-}
    ports:
      - "127.0.0.1:8001:8001"
    command:
      - uvicorn
      - pingjack.apps.vulnerable:create
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8001"

  # Also intentionally vulnerable, and behind exactly the same two actions. It uses no shell, which
  # is what makes it interesting: it is immune to the metacharacter payload and still discloses the
  # same fixture through argument injection.
  naive:
    build: .
    image: pingjack:dev
    profiles: ["vulnerable"]
    environment:
      ALLOW_VULNERABLE_DEMO: ${ALLOW_VULNERABLE_DEMO:-}
    ports:
      - "127.0.0.1:8002:8002"
    command:
      - uvicorn
      - pingjack.apps.naive:create
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8002"

  # The one-shot comparison. Disposable: it starts all three applications inside itself against
  # fresh temporary databases, drives them over real localhost HTTP, prints the verdicts, and exits.
  # It carries the same two-action gate as the applications it starts, so it is not a way around
  # them. `network_mode: none` still leaves a loopback interface, so the demo does real HTTP while
  # provably reaching nothing outside the container.
  #
  #   ALLOW_VULNERABLE_DEMO=true docker compose --profile demo run --rm demo
  demo:
    build: .
    image: pingjack:dev
    profiles: ["demo"]
    network_mode: none
    environment:
      ALLOW_VULNERABLE_DEMO: ${ALLOW_VULNERABLE_DEMO:-}
    command: ["pingjack-demo"]

  # The verification boundary. `docker compose run --rm verify` is the one documented command, and
  # GitHub Actions runs exactly the same thing. Its profile keeps it out of `docker compose up`.
  verify:
    build: .
    image: pingjack:dev
    profiles: ["verify"]
    # No network at all. Any outbound access from the applications, the probe, or the tests fails
    # loudly instead of passing unnoticed.
    network_mode: none
    volumes:
      - .:/workspace
    command: ["bash", "scripts/verify.sh"]
