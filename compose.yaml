name: pingjack

services:
  # The secure application is the default service: `docker compose up` starts this and nothing
  # else. Its port is published on the loopback interface only.
  secure:
    build: .
    image: pingjack:dev
    ports:
      - "127.0.0.1:8000:8000"
    # Binding 0.0.0.0 inside the container is what makes the loopback-only published port above
    # reachable; the container's own network is not exposed anywhere else.
    command: ["uvicorn", "pingjack.apps.secure:app", "--host", "0.0.0.0", "--port", "8000"]

  # Intentionally vulnerable. Starting it takes two deliberate actions: this profile, and the
  # acknowledgement variable. Without the acknowledgement the application refuses to start and says
  # so, even when the profile is enabled.
  #
  #   ALLOW_VULNERABLE_DEMO=true docker compose --profile vulnerable up
  vulnerable:
    build: .
    image: pingjack:dev
    profiles: ["vulnerable"]
    environment:
      ALLOW_VULNERABLE_DEMO: ${ALLOW_VULNERABLE_DEMO:-}
    ports:
      - "127.0.0.1:8001:8001"
    command:
      - uvicorn
      - pingjack.apps.vulnerable:create
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8001"

  # The verification boundary. `docker compose run --rm verify` is the one documented command, and
  # GitHub Actions runs exactly the same thing. Its profile keeps it out of `docker compose up`.
  verify:
    build: .
    image: pingjack:dev
    profiles: ["verify"]
    # No network at all. Any outbound access from the applications, the probe, or the tests fails
    # loudly instead of passing unnoticed.
    network_mode: none
    volumes:
      - .:/workspace
    command: ["bash", "scripts/verify.sh"]
