[project]
name = "pingjack"
version = "0.1.0"
description = "Educational OS command injection demonstration. Local containers only."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.scripts]
fleetprobe = "pingjack.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pingjack"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "S", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
